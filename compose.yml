services:
  flow:
    build: .
    image: cosmic-demo-flow:latest
    container_name: demo-flow
    restart: unless-stopped
    # Static files only; the process idles at ~40 MB.
    mem_limit: 128m
    environment:
      - PORT=3105
    # Loopback only. A bare "3105:3105" would be public: Docker's DNAT bypasses ufw.
    ports:
      - "127.0.0.1:3105:3105"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
